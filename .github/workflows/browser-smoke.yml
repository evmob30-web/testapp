name: Browser startup smoke test
on:
  pull_request:
    paths:
      - 'js/**'
      - 'index.html'
      - 'scripts/browser-start.cjs'
      - '.github/workflows/browser-smoke.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: nohup python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/emberwild-http.log 2>&1 &
      - run: node scripts/browser-start.cjs
