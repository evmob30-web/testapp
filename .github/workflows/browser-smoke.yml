name: Browser startup smoke test
on:
  pull_request:
    paths:
      - 'js/**'
      - 'assets/characters/**'
      - 'vendor/GLTFLoader.js'
      - 'index.html'
      - 'scripts/browser-start.cjs'
      - 'scripts/browser-quest-loot.cjs'
      - 'scripts/browser-quest-guide.cjs'
      - 'scripts/browser-terrain.cjs'
      - 'scripts/browser-wolves.cjs'
      - 'scripts/browser-markers.cjs'
      - 'scripts/browser-mage-training.cjs'
      - 'scripts/browser-arcane-trial.cjs'
      - 'scripts/browser-mobile*.cjs'
      - 'style.css'
      - '.github/workflows/browser-smoke.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - name: Prepare Chromium
        run: |
          emberwild_browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$emberwild_browser_path" ]; then
            "$emberwild_browser_path" --version
            printf 'EMBERWILD_CHROMIUM_PATH=%s\n' "$emberwild_browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: nohup python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/emberwild-http.log 2>&1 &
      - run: node scripts/browser-start.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emberwild-browser-screenshots
          path: /tmp/emberwild-*.png
