name: Emberwild tests
on:
  push:
    branches:
      - feature/reusable-character-rig
  pull_request:
    paths:
      - 'js/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/emberwild-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/character-rig.js
      - run: node --test tests/*.cjs
